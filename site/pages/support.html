<dc-import name="SiteHeader" current="support" hint-size="100%,70px"></dc-import>
<main data-screen-label="Support" style="max-width:1200px;margin:0 auto;padding:0 16px">
  <div style="margin-top:44px;display:flex;flex-direction:column;gap:14px;max-width:760px">
    <span style="font-family:VT323,monospace;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#7fd6c2">Support</span>
    <h1 style="margin:0;font:800 clamp(34px,5vw,52px)/1.05 'Nunito Sans',sans-serif;color:#f6efdc">Questions and answers</h1>
    <nav class="topics" aria-label="Topics" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
        <a href="{{ g.href }}" style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;text-transform:uppercase;background:#0a0d1f;border:2px solid #22304a;padding:4px 10px;color:#9fd8c8;text-decoration:none;transition:border-color 120ms" style-hover="border-color:#7fd6c2">{{ g.name }}</a>
      </sc-for>
    </nav>
  </div>

  <div style="margin-top:44px;display:flex;flex-direction:column;gap:48px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
      <section id="{{ g.id }}" style="display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px">
        <h2 style="margin:0;display:flex;align-items:baseline;gap:14px;font:700 clamp(22px,2.6vw,28px)/1.2 'Nunito Sans',sans-serif;color:#f6efdc"><span style="font-family:VT323,monospace;font-size:18px;letter-spacing:3px;color:#7fd6c2;text-transform:uppercase">{{ g.name }}</span></h2>
        <div style="background:linear-gradient(#13243f,#0f1d34);border:2px solid #3f6f7a;box-shadow:0 0 0 2px #090c1e,inset 0 0 0 2px #090c1e;padding:6px">
          <sc-for list="{{ g.items }}" as="q" hint-placeholder-count="3">
            <details style="border-bottom:2px solid #22304a">
              <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:16px 20px;font:700 17px/1.4 'Nunito Sans',sans-serif;color:#f6efdc;transition:color 120ms" style-hover="color:#9fd8c8"><span style="font-family:VT323,monospace;font-size:22px;color:#f2c744;line-height:1">+</span>{{ q.q }}</summary>
              <p style="margin:0;padding:0 20px 20px 58px;font:400 16px/1.6 'Nunito Sans',sans-serif;color:#c9c5ea;text-wrap:pretty">{{ q.a }}</p>
            </details>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <section class="sec contact" style="margin-top:72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px">
    <div style="border:2px solid #22304a;padding:26px 24px;display:flex;flex-direction:column;gap:10px">
      <span style="font-family:VT323,monospace;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:#7fd6c2">Email</span>
      <a href="mailto:support@linkturbo.app" style="font:700 20px/1.3 'Nunito Sans',sans-serif;text-decoration:none">support@linkturbo.app</a>
      <p style="margin:0;font:400 16px/1.6 'Nunito Sans',sans-serif;color:#c9c5ea">For anything the questions above do not cover. One person reads it.</p>
    </div>
    <div style="border:2px solid #22304a;padding:26px 24px;display:flex;flex-direction:column;gap:10px">
      <span style="font-family:VT323,monospace;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:#7fd6c2">Discord</span>
      <a href="https://discord.gg/N3jdn6WPJd" style="font:700 20px/1.3 'Nunito Sans',sans-serif;text-decoration:none">discord.gg/N3jdn6WPJd</a>
      <p style="margin:0;font:400 16px/1.6 'Nunito Sans',sans-serif;color:#c9c5ea">Release news and other people using Link.</p>
    </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,220px"></dc-import>
