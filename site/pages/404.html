<dc-import name="SiteHeader" current="" hint-size="100%,70px"></dc-import>
<main data-screen-label="Not found" style="max-width:1200px;margin:0 auto;padding:0 16px">
  <section class="sec nf" style="margin:48px auto 0;max-width:720px;background:linear-gradient(#13243f,#0f1d34);border:2px solid #3f6f7a;box-shadow:0 0 0 2px #090c1e,inset 0 0 0 2px #090c1e;padding:20px;display:flex;flex-direction:column;gap:20px">
    <div class="nf-screen" style="position:relative;background:#0a0d1f;border:2px solid #22304a;min-height:300px;overflow:hidden;display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px)">
      <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(63,111,122,.25),transparent 60%)"></div>
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px">
        <span style="display:inline-flex;align-items:center;gap:10px;font-family:VT323,monospace;font-size:20px;letter-spacing:4px;color:#ff8a8a">{{ dot }}NO SIGNAL</span>
        <span style="font-family:VT323,monospace;font-size:clamp(96px,18vw,160px);line-height:.85;letter-spacing:8px;color:#ffd27a;font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 #090c1e">404</span>
        <span style="font-family:VT323,monospace;font-size:18px;letter-spacing:3px;color:#b9b3a4">CHANNEL NOT FOUND</span>
      </div>
    </div>
    <div class="nf-row" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:0 6px 6px">
      <p style="margin:0;font:400 17px/1.5 'Nunito Sans',sans-serif;color:#f6efdc">This page is not here. The stream may have moved, or the address has a typo.</p>
      <a href="Home.dc.html" style="display:inline-flex;align-items:center;padding:13px 24px;background:linear-gradient(#ffe27a,#d9a52a);color:#090c1e;border:2px solid #090c1e;box-shadow:0 0 0 2px #f2c744;font:800 16px 'Nunito Sans',sans-serif;text-decoration:none;transition:box-shadow 120ms" style-hover="box-shadow:0 0 0 2px #f2c744,0 0 28px rgba(242,199,68,.5)">Back to the home page</a>
    </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,220px"></dc-import>
