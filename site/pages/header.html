<header class="hdr" style="border-bottom:2px solid #22304a;background:rgba(9,12,30,.55)">
  <div class="hdr-in" style="max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px">
    <a class="brand" href="Home.dc.html" aria-label="Link home" style="font-family:VT323,monospace;font-size:34px;line-height:1;letter-spacing:6px;color:#ff5d5d;text-shadow:2px 2px 0 #090c1e;text-decoration:none">LINK</a>
    <nav class="main-nav" aria-label="Main" style="display:flex;flex-wrap:wrap;gap:4px 22px">
      <div class="nav-drop">
        <a href="Turbo.dc.html" aria-haspopup="true" style="display:inline-flex;align-items:center;gap:7px;font:600 16px/1 'Nunito Sans',sans-serif;color:#c9c5ea;text-decoration:none;padding:8px 0;border-bottom:2px solid {{ productLine }};transition:color 120ms" style-hover="color:#f6efdc">Link <span style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;color:#ff5d5d">TURBO</span><span class="nav-caret" aria-hidden="true">▾</span></a>
        <div class="drop-panel">
          <a class="drop-link" href="Turbo.dc.html" {{ turboCur }}><b>Link <span style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;color:#ff5d5d">TURBO</span></b><small>The full program for Windows</small></a>
          <a class="drop-link" href="/turbo#night"><b>Link <span style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;color:#b9b4e0">NIGHT</span></b><small>Records while you sleep</small></a>
          <a class="drop-link" href="Home.dc.html" {{ liteCur }}><b>Link <span style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;color:#b9b4e0">LITE</span></b><small>The browser extension</small></a>
        </div>
      </div>
      <a href="How It Works.dc.html" style="font:600 16px/1 'Nunito Sans',sans-serif;color:#c9c5ea;text-decoration:none;padding:8px 0;border-bottom:2px solid {{ howLine }};transition:color 120ms" style-hover="color:#f6efdc">How it works</a>
      <a href="Support.dc.html" style="font:600 16px/1 'Nunito Sans',sans-serif;color:#c9c5ea;text-decoration:none;padding:8px 0;border-bottom:2px solid {{ supportLine }};transition:color 120ms" style-hover="color:#f6efdc">Support</a>
    </nav>
    <div class="hdr-actions" style="margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px">
      <a href="https://discord.gg/N3jdn6WPJd" style="display:inline-flex;align-items:center;padding:10px 16px;background:#0a0d1f;color:#f6efdc;border:2px solid #3a3160;font:700 15px 'Nunito Sans',sans-serif;text-decoration:none;transition:border-color 120ms" style-hover="border-color:#7fd6c2">Discord</a>
      <a href="{{ ctaHref }}" style="display:inline-flex;align-items:center;padding:10px 18px;background:linear-gradient(#ffe27a,#d9a52a);color:#090c1e;border:2px solid #090c1e;box-shadow:0 0 0 2px #f2c744;font:800 15px 'Nunito Sans',sans-serif;text-decoration:none;transition:box-shadow 120ms" style-hover="box-shadow:0 0 0 2px #f2c744,0 0 26px rgba(242,199,68,.5)">{{ ctaLabel }}</a>
    </div>
    <a class="cta-short" href="{{ ctaHref }}">{{ ctaShort }}</a>
  </div>
  <details class="menu">
    <summary class="menu-btn" aria-label="Menu"><span class="menu-ic" aria-hidden="true"></span></summary>
    <div class="menu-panel">
      <nav class="menu-nav" aria-label="Main menu">
        <a class="menu-link" href="Home.dc.html" {{ liteCur }}>Link Lite</a>
        <a class="menu-link" href="Turbo.dc.html" {{ turboCur }}>Link <span style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;color:#ff5d5d">TURBO</span></a>
        <a class="menu-link" href="/turbo#night">Link <span style="font-family:VT323,monospace;font-size:17px;letter-spacing:2px;color:#b9b4e0">NIGHT</span></a>
        <a class="menu-link" href="How It Works.dc.html" {{ howCur }}>How it works</a>
        <a class="menu-link" href="Support.dc.html" {{ supportCur }}>Support</a>
      </nav>
      <div class="menu-actions">
        <a href="https://discord.gg/N3jdn6WPJd" style="display:inline-flex;align-items:center;padding:10px 16px;background:#0a0d1f;color:#f6efdc;border:2px solid #3a3160;font:700 15px 'Nunito Sans',sans-serif;text-decoration:none;transition:border-color 120ms" style-hover="border-color:#7fd6c2">Discord</a>
        <a class="menu-cta" href="{{ ctaHref }}" style="display:inline-flex;align-items:center;padding:10px 18px;background:linear-gradient(#ffe27a,#d9a52a);color:#090c1e;border:2px solid #090c1e;box-shadow:0 0 0 2px #f2c744;font:800 15px 'Nunito Sans',sans-serif;text-decoration:none;transition:box-shadow 120ms" style-hover="box-shadow:0 0 0 2px #f2c744,0 0 26px rgba(242,199,68,.5)">{{ ctaMid }}</a>
      </div>
    </div>
  </details>
  <script>document.querySelectorAll(".menu a").forEach(function(a){a.addEventListener("click",function(){var m=document.querySelector("details.menu");if(m)m.open=false})})</script>
</header>
