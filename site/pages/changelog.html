<dc-import name="SiteHeader" current="" hint-size="100%,70px"></dc-import>
<main data-screen-label="What's new" style="max-width:1200px;margin:0 auto;padding:0 16px">
  <div style="margin-top:44px;display:flex;flex-direction:column;gap:14px;max-width:760px">
    <span style="font-family:VT323,monospace;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#7fd6c2">Link Lite Recorder</span>
    <h1 style="margin:0;font:800 clamp(34px,5vw,52px)/1.05 'Nunito Sans',sans-serif;color:#f6efdc">What's new</h1>
    <p style="margin:0;font:400 18px/1.55 'Nunito Sans',sans-serif;color:#c9c5ea">Every version, newest first.</p>
  </div>
  <ol class="log" style="list-style:none;margin:44px 0 0;padding:0;max-width:820px;display:flex;flex-direction:column">
    <sc-for list="{{ entries }}" as="e" hint-placeholder-count="3">
      <li style="display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr);gap:16px 28px;padding:28px 0;border-top:2px solid #22304a">
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <span style="font-family:VT323,monospace;font-size:20px;letter-spacing:2px;background:#0a0d1f;border:2px solid #22304a;padding:2px 10px;color:#f2c744;font-variant-numeric:tabular-nums">{{ e.v }}</span>
          <time style="font-family:VT323,monospace;font-size:16px;letter-spacing:2px;color:#b9b3a4;font-variant-numeric:tabular-nums">{{ e.date }}</time>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h2 style="margin:0;font:700 20px/1.3 'Nunito Sans',sans-serif;color:#f6efdc">{{ e.t }}</h2>
          <p style="margin:0;font:400 16px/1.6 'Nunito Sans',sans-serif;color:#c9c5ea;text-wrap:pretty">{{ e.d }}</p>
        </div>
      </li>
    </sc-for>
  </ol>
</main>
<dc-import name="SiteFooter" hint-size="100%,220px"></dc-import>
