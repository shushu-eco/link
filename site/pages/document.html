<dc-import name="SiteHeader" current="" hint-size="100%,70px"></dc-import>
<main  style="max-width:1200px;margin:0 auto;padding:0 16px">
  <div style="margin-top:44px;display:flex;flex-direction:column;gap:14px;max-width:760px">
    <span style="font-family:VT323,monospace;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#7fd6c2">{{ kicker }}</span>
    <h1 style="margin:0;font:800 clamp(34px,5vw,52px)/1.05 'Nunito Sans',sans-serif;color:#f6efdc">{{ title }}</h1>
    <p style="margin:0;font-family:VT323,monospace;font-size:18px;letter-spacing:2px;color:#b9b3a4;font-variant-numeric:tabular-nums">LAST UPDATED · {{ updated }}</p>
  </div>

  <div class="guide" style="margin-top:40px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <nav class="toc" aria-label="Sections" style="flex:1 1 220px;max-width:280px;min-width:220px;position:sticky;top:16px;background:#0a0d1f;border:2px solid #22304a;padding:6px">
      <details class="m-shut" open style="display:block">
        <summary style="list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-family:VT323,monospace;font-size:18px;letter-spacing:3px;color:#7fd6c2"><span class="toc-label">CONTENTS</span><span class="toc-now"></span><span class="toc-caret" style="color:#6b6a7a">▾</span></summary>
        <ol style="list-style:none;margin:0;padding:4px 0 6px;display:flex;flex-direction:column">
          <sc-for list="{{ sections }}" as="s">
            <li><a href="{{ s.href }}" style="display:flex;gap:10px;padding:7px 12px;font:600 15px/1.4 'Nunito Sans',sans-serif;color:#c9c5ea;text-decoration:none;border-left:2px solid transparent;transition:color 120ms,border-color 120ms" style-hover="color:#f6efdc;border-color:#7fd6c2"><span style="font-family:VT323,monospace;font-size:16px;color:#ffd27a;font-variant-numeric:tabular-nums;letter-spacing:1px">{{ s.n }}</span><span>{{ s.t }}</span></a></li>
          </sc-for>
        </ol>
      </details>
    </nav>

    <article class="doc" style="flex:3 1 480px;min-width:0;max-width:68ch;display:flex;flex-direction:column;gap:18px;font:400 17px/1.65 'Nunito Sans',sans-serif;color:#c9c5ea">
{{ body }}
    </article>
  </div>
</main>
<dc-import name="SiteFooter" hint-size="100%,220px"></dc-import>
